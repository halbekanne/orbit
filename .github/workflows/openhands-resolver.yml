name: OpenHands Auto-Resolver

on:
  issues:
    types: [labeled]

jobs:
  openhands-fix:
    # This ensures the action ONLY triggers when you apply a specific label
    if: github.event.label.name == 'let-openhands-handle-it'
    uses: All-Hands-AI/OpenHands/.github/workflows/openhands-resolver.yml@main
    with:
      issue_number: ${{ github.event.issue.number }}
      # Verifizierter String für Mistral Devstral
      llm_model: "mistral/devstral-latest"
      max_iterations: 30
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      # WICHTIG: Nutze GITHUB_TOKEN für Standard-Rechte oder ein PAT für mehr Kontrolle
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
