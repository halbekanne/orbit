name: OpenHands Auto-Resolver

on:
  issues:
    types: [labeled]

jobs:
  openhands-fix:
    # Der Trigger: Funktioniert nur, wenn du das Label vergibst
    if: github.event.label.name == 'let-openhands-handle-it'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run OpenHands Resolver via Docker
        run: |
          docker run --rm \
            -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -e LLM_API_KEY=${{ secrets.LLM_API_KEY }} \
            -e LLM_MODEL="mistral/devstral-latest" \
            -v $(pwd):/workspace \
            ghcr.io/all-hands-ai/openhands-resolver:latest \
            --issue-number ${{ github.event.issue.number }} \
            --model "mistral/devstral-latest" \
            --max-iterations 30
